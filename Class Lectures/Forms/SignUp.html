<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>
<body>
    <h1>Sign Up Page</h1>
    <form action="/action_page.php">
        <label for="fName">First Name: </label>
        <input type="text" id="fName" placeholder="Enter the First name: ">
        <br><br>
        <label for="lName">Last Name: </label>
        <input type="text" id="lName" placeholder="Enter the Last name: ">
        <br><br>
        <label for="uName">UserName: </label>
        <input type="text" id="uName" placeholder="Enter the UserName: ">
        <br><br>
        <label for="Email">Email: </label>
        <input type="email" placeholder="Enter your Email: " id="Email">
        <br><br>
        <label for="pass">Password: </label>
        <input type="password" id="pass" placeholder="Create your password: ">
        <br><br>
        <label for="Cpass">Confirm Password: </label>
        <input type="password" id="Cpass" placeholder="Confirm your password: ">
    </form>
</body>
</html>
